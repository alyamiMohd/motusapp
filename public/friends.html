<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Find people on Motus, add friends and see their dashboards.">
<title>Motus · Friends</title>
<meta name="theme-color" content="#000000">
<meta property="og:image" content="https://motus.motusapp.workers.dev/brand/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="brand/favicon.ico" sizes="any">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<link rel="manifest" href="brand/site.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="connect friends">
  <a class="back" href="profile.html">‹ Profile</a>
  <h1>Friends</h1>

  <section class="account" id="out" hidden>
    <a class="btn wide" href="connect.html">Sign in</a>
  </section>

  <div id="in" hidden>
    <p class="note" id="nouser" hidden>Pick a username first: <a href="profile.html"><u>Profile</u></a> → Edit profile.</p>

    <div class="act search">
      <input class="key" id="q" type="search" autocomplete="off" autocapitalize="none" spellcheck="false"
        placeholder="Name or @username" aria-label="Find people by name or username">
    </div>
    <p class="msg" id="m-find" role="status"></p>
    <ul class="people" id="results"></ul>

    <section id="s-incoming" hidden><h2>Asking you</h2><ul class="people" id="incoming"></ul></section>
    <section><h2>Your friends</h2><ul class="people" id="friends"></ul>
      <p class="what" id="nofriends" hidden>None yet. Search above.</p></section>
    <section id="s-outgoing" hidden><h2>Sent</h2><ul class="people" id="outgoing"></ul></section>

    <p class="note" id="privacy"></p>
  </div>
</main>
<script type="module" src="js/pages/friends.js"></script>
</body>
</html>
