<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Your weekly averages for sleep, steps, calories and weight, and how many workouts you did.">
<title>Motus · Weeks</title>
<meta name="theme-color" content="#000000">
<meta property="og:image" content="https://motus.motusapp.workers.dev/brand/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="brand/favicon.ico" sizes="any">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<link rel="manifest" href="brand/site.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <p class="banner" id="banner" hidden></p>
  <table>
    <thead><tr><th>Week</th><th>Sleep</th><th>Steps</th><th>Cal</th><th id="kg">Kg</th><th>Lifts</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <button class="more" id="more" hidden></button>
  <p class="foot">A week is added here when it ends. <button class="more inline" id="csv" type="button">Download as CSV</button></p>
</main>
<script type="module" src="js/pages/weeks.js"></script>
</body>
</html>
