<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Motus</title>
<!-- served at /u/<username>: every relative path here (and in the navbar) starts at the root -->
<base href="/">
<meta name="theme-color" content="#000000">
<meta property="og:image" content="https://motus.motusapp.workers.dev/brand/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="brand/favicon.ico" sizes="any">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<link rel="manifest" href="brand/site.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="connect profile public">
  <div id="card" hidden>
    <div class="photo"><span id="initial" class="mark"></span><img id="photo" alt="" hidden></div>
    <b id="name"></b>
    <small id="user"></small>
    <div class="act rel" id="rel"></div>
    <p class="msg" id="m-rel" role="status"></p>
  </div>
  <p class="what" id="none" hidden>There's no one on Motus with that username.</p>
  <p class="note" id="why" hidden></p>

  <div class="theirs" id="dash" hidden>
    <div class="top" id="top"></div>
    <table>
      <thead><tr><th>Day</th><th>Sleep</th><th>Steps</th><th>Cal</th><th id="kg">Kg</th><th>Lift</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="charts"></div>
    <p class="foot" id="foot"></p>
  </div>
  <p class="note" id="about" style="margin-top:32px" hidden><a href="./">What's Motus?</a></p>
</main>
<script type="module" src="js/pages/user.js"></script>
</body>
</html>
