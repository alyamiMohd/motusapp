<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Motus</title>
<!-- served at /u/<username>, so every path here starts at the root -->
<meta name="theme-color" content="#000000">
<meta property="og:image" content="https://motus.motusapp.workers.dev/brand/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/brand/favicon.ico" sizes="any">
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="manifest" href="/brand/site.webmanifest">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<nav><div class="bar"><a href="/" class="brand" aria-label="Motus home"><img src="/brand/mark.png" alt="" width="46" height="46"><b>motus</b></a></div></nav>
<main class="connect profile public">
  <div id="card" hidden>
    <div class="photo"><span id="initial"></span><img id="photo" alt="" hidden></div>
    <b id="name"></b>
    <small id="user"></small>
  </div>
  <p class="what" id="none" hidden>There's no one on Motus with that username.</p>
  <p class="note" style="margin-top:32px"><a href="/">What's Motus?</a></p>
</main>
<script type="module" src="/js/pages/user.js"></script>
</body>
</html>
